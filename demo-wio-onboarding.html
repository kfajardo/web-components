<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIO Onboarding Static Gallery</title>
    <style>
        :root {
            --primary-color: #0070ba;
            --background-color: #f5f7fa;
            --text-color: #333;
            --border-radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 40px;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        .gallery-item {
            position: relative;
        }

        .state-label {
            position: absolute;
            top: -15px;
            left: 20px;
            background: #333;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Mock specific environment for components */
        wio-onboarding {
            display: block;
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <div class="gallery-container">
        <header>
            <h1>WIO Onboarding UI Gallery</h1>
            <p class="subtitle">Static showcase of all component states</p>
        </header>

        <!-- Step 1: Business Details -->
        <div class="gallery-item">
            <div class="state-label">Step 1: Business Details</div>
            <wio-onboarding id="step1"></wio-onboarding>
        </div>

        <!-- Step 2: Bank Details -->
        <div class="gallery-item">
            <div class="state-label">Step 2: Bank Account</div>
            <wio-onboarding id="step2"></wio-onboarding>
        </div>

        <!-- Step 3: Representatives -->
        <div class="gallery-item">
            <div class="state-label">Step 3: Representatives</div>
            <wio-onboarding id="step3"></wio-onboarding>
        </div>

        <!-- Step 4: Verification -->
        <div class="gallery-item">
            <div class="state-label">Step 4: Business Verification</div>
            <wio-onboarding id="step4"></wio-onboarding>
        </div>

        <!-- Loading State -->
        <div class="gallery-item">
            <div class="state-label">State: Loading</div>
            <wio-onboarding id="loading"></wio-onboarding>
        </div>

        <!-- Success State -->
        <div class="gallery-item">
            <div class="state-label">State: Success</div>
            <wio-onboarding id="success" done-button-text="Complete Setup"></wio-onboarding>
        </div>

        <!-- Failure State -->
        <div class="gallery-item">
            <div class="state-label">State: Failure</div>
            <wio-onboarding id="failure"></wio-onboarding>
        </div>

    </div>

    <!-- Dependencies -->
    <script src="api.js"></script>
    <script src="wio-onboarding.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mockData = {
                businessDetails: {
                    businessName: "Acme Corp Demo",
                    doingBusinessAs: "Acme",
                    ein: "12-3456789",
                    businessWebsite: "https://example.com",
                    businessPhoneNumber: "(555) 123-4567",
                    businessEmail: "admin@acmecorp.com",
                    BusinessAddress1: "123 Demo St",
                    businessCity: "New York",
                    businessState: "NY",
                    businessPostalCode: "10001"
                },
                bankDetails: {
                    bankAccountHolderName: "Acme Corp",
                    bankAccountType: "checking",
                    bankRoutingNumber: "123456789",
                    bankAccountNumber: "000123456789"
                },
                representatives: [
                    {
                        representativeFirstName: "John",
                        representativeLastName: "Doe",
                        representativeJobTitle: "CEO",
                        representativeEmail: "john@acme.com"
                    }
                ]
            };

            // Force Step 2
            const step2 = document.getElementById('step2');
            step2.onLoad = mockData; // Pre-fill data
            setTimeout(() => {
                step2.setState({
                    currentStep: 1,
                    completedSteps: new Set([0])
                });
            }, 100);

            // Force Step 3
            const step3 = document.getElementById('step3');
            step3.onLoad = mockData;
            setTimeout(() => {
                step3.setState({
                    currentStep: 2,
                    completedSteps: new Set([0, 1])
                });
            }, 100);

            // Force Step 4
            const step4 = document.getElementById('step4');
            step4.onLoad = mockData;
            setTimeout(() => {
                step4.setState({
                    currentStep: 3,
                    completedSteps: new Set([0, 1, 2])
                });
            }, 100);

            // Force Loading
            const loading = document.getElementById('loading');
            setTimeout(() => {
                loading.setState({
                    uiState: { isLoading: true }
                });
            }, 100);

            // Force Success
            const success = document.getElementById('success');
            success.onDone = (data) => {
                console.log('✅ Done button clicked!', data);
                alert('Done button clicked! Check console for data.');
            };
            setTimeout(() => {
                success.setState({
                    formData: mockData,
                    isSubmitted: true
                });
            }, 100);

            // Force Failure
            const failure = document.getElementById('failure');
            setTimeout(() => {
                failure.setState({
                    isSubmissionFailed: true,
                    uiState: {
                        errorMessage: "We were unable to verify your business information. Please double-check your details and try again."
                    }
                });
            }, 100);
        });
    </script>
</body>

</html>
