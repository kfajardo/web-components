<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bison Operator Payments - Demo</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: #f0f2f5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 40px 20px;
      }
      .demo-card {
        background: #fff;
        border-radius: 12px;
        padding: 24px 32px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        text-align: center;
        max-width: 480px;
        width: 100%;
      }
      .demo-card h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #0f2a39;
        margin-bottom: 4px;
      }
      .demo-card p {
        font-size: 0.875rem;
        color: #5f6e78;
        margin-bottom: 20px;
        line-height: 1.5;
      }
      .demo-card .hint {
        font-size: 0.75rem;
        color: #9ca3af;
        margin-top: 12px;
      }

      /* Attribute debug controls */
      .demo-controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
        text-align: left;
      }
      .demo-controls label {
        font-size: 0.75rem;
        font-weight: 600;
        color: #5f6e78;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .demo-controls input {
        width: 100%;
        padding: 8px 12px;
        border: 1.5px solid #e8e8e8;
        border-radius: 8px;
        font-size: 0.875rem;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color: #0f2a39;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .demo-controls input:focus {
        border-color: #4c7b63;
        box-shadow: 0 0 0 3px rgba(76, 123, 99, 0.15);
      }
      .demo-controls input::placeholder {
        color: #b0b8c0;
      }
      .demo-field-row {
        display: flex;
        gap: 10px;
      }
      .demo-field-row > div {
        flex: 1;
      }
      .demo-prio-tag {
        font-size: 0.65rem;
        font-weight: 700;
        background: #e8f0eb;
        color: #4c7b63;
        padding: 1px 6px;
        border-radius: 4px;
        margin-left: 6px;
        vertical-align: middle;
      }

      /* Event log */
      .event-log {
        max-width: 480px;
        width: 100%;
        background: #1e1e2e;
        color: #cdd6f4;
        border-radius: 12px;
        padding: 16px 20px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.72rem;
        line-height: 1.8;
        max-height: 260px;
        overflow-y: auto;
      }
      .event-log h3 {
        color: #a6e3a1;
        font-size: 0.8rem;
        margin-bottom: 8px;
      }
      .event-log .entry {
        opacity: 0.85;
      }
      .event-log .entry.success {
        color: #a6e3a1;
      }
      .event-log .entry.close {
        color: #f9e2af;
      }
      .event-log .entry.lookup {
        color: #89b4fa;
      }
      .event-log .entry.error {
        color: #f38ba8;
      }
      .event-log .entry.disabled {
        color: #9399b2;
      }
    </style>
  </head>
  <body>
    <div class="demo-card">
      <h1>Operator Bank Account Mgt.</h1>
      <p>
        Set the operator attributes below, then click the button to open the
        Bank Management modal. Both fields empty = component disabled.
      </p>

      <!-- Debug attribute controls -->
      <div class="demo-controls">
        <div class="demo-field-row">
          <div>
            <label for="input-opOrgId">
              op-org-id <span class="demo-prio-tag">PRIORITY 1</span>
            </label>
            <input
              id="input-opOrgId"
              type="text"
              placeholder="e.g. 12345"
            />
          </div>
          <div>
            <label for="input-orgNumber">
              org-number <span class="demo-prio-tag" style="background:#fef3c7;color:#92400e">PRIORITY 2</span>
            </label>
            <input
              id="input-orgNumber"
              type="text"
              placeholder="e.g. ORG-001"
            />
          </div>
        </div>
      </div>

      <bison-operator-payments></bison-operator-payments>
    </div>

    <div class="event-log" id="log">
      <h3>Event Log</h3>
    </div>

    <!-- IMPORTANT: api.js uses ES module export, load as module or use the global -->
    <script src="api.js" type="module"></script>
    <script src="bison-operator-payments.js"></script>
    <script type="module">
      import { BisonJibPayAPI } from './api.js';

      // Wire up the API globally so the component can use it
      const api = new BisonJibPayAPI(
        'https://bison-backend-development-hhgrdbhcbwhahdfk.southeastasia-01.azurewebsites.net',
        'R80WMkbNN8457RofiMYx03DL65P06IaVT30Q2emYJUBQwYCzRC'
      );
      window.__bisonApi = api;

      const comp = document.querySelector("bison-operator-payments");
      const log = document.getElementById("log");
      const inputOpOrgId = document.getElementById("input-opOrgId");
      const inputOrgNumber = document.getElementById("input-orgNumber");

      // ── Helpers ──────────────────────────────────────
      function addLog(text, cls) {
        const el = document.createElement("div");
        el.className = "entry " + (cls || "");
        el.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
      }

      // ── Attribute binding ─────────────────────────────
      // When the user types in the debug inputs, update the
      // component attributes — this triggers the observed
      // attribute callback and the Enverus lookup flow.
      inputOpOrgId.addEventListener("input", (e) => {
        const val = e.target.value.trim();
        if (val) {
          comp.setAttribute("op-org-id", val);
          addLog(`SET op-org-id="${val}"`, "lookup");
        } else {
          comp.removeAttribute("op-org-id");
          addLog("REMOVED op-org-id", "disabled");
        }
      });

      inputOrgNumber.addEventListener("input", (e) => {
        const val = e.target.value.trim();
        if (val) {
          comp.setAttribute("org-number", val);
          addLog(`SET org-number="${val}"`, "lookup");
        } else {
          comp.removeAttribute("org-number");
          addLog("REMOVED org-number", "disabled");
        }
      });

      // ── Component events ──────────────────────────────
      comp.addEventListener("bop-close", () =>
        addLog("bop-close fired", "close"),
      );
      comp.addEventListener("bop-success", (e) => {
        addLog(
          `bop-success → ${e.detail.bankName} · ${e.detail.accountType} · ••••${e.detail.lastFour}`,
          "success",
        );
      });

      // Operator lookup event — key debug output
      comp.addEventListener("bop-operator-lookup", (e) => {
        const d = e.detail;
        if (d.status === "success") {
          addLog(`bop-operator-lookup → SUCCESS`, "success");
          addLog(`  Data: ${JSON.stringify(d.data)}`, "success");
        } else if (d.status === "error") {
          addLog(`bop-operator-lookup → ERROR`, "error");
          addLog(`  ${JSON.stringify(d.error)}`, "error");
        } else if (d.status === "disabled") {
          addLog(`bop-operator-lookup → DISABLED: ${d.reason}`, "disabled");
        }
      });

      addLog("Component ready. Set op-org-id or org-number to enable.");
    </script>
  </body>
</html>
